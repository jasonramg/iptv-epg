name: Update EPG Status

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *" # Fallback daily run
  push:
    branches:
      - main
    paths:
      - 'epg/*.xml.gz' # Triggers instantly whenever a generator pushes a new file

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Update status table
        run: python .github/scripts/update_status.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add README.md

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Update EPG status table"
          git pull --rebase origin main
          git push
